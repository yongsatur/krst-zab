{% extends "admin/base.html" %}

{% load static %}

{% block extrahead %}
<link href="{% static 'img/logo.png' %}" type="image/png" rel="icon">
{% endblock %}

{% block title %} Панель администратора | Django {% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">Панель администратора</a>
</h1>
{% endblock %}

{% block extrastyle %} 

<style>
    html[data-theme="light"],
    :root {
        --primary: #aaa;
        --secondary: #303030;
        --accent: #fefefe;
        --primary-fg: #fff;

        --body-fg: #303030;
        --body-bg: #fff;
        --body-quiet-color: #666;
        --body-medium-color: #444;
        --body-loud-color: #282828;

        --header-color: #fefefe;
        --header-branding-color: var(--accent);
        --header-bg: var(--secondary);
        --header-link-color: var(--primary-fg);

        --breadcrumbs-fg: #8F2F73;
        --breadcrumbs-link-fg: #303030;
        --breadcrumbs-bg: #ddd;

        --link-fg: #303030;
        --link-hover-color: #8F2F73;
        --link-selected-fg: var(--secondary);

        --hairline-color: #e8e8e8;
        --border-color: #ccc;

        --error-fg: #ba2121;

        --message-success-bg: #dfd;
        --message-warning-bg: #ffc;
        --message-error-bg: #ffefef;

        --darkened-bg: #fff; 
        --selected-bg: #eee; 
        --selected-row: #eee;

        --button-fg: #fff;
        --button-bg: var(--secondary);
        --button-hover-bg: #8F2F73;
        --default-button-bg: #303030;
        --default-button-hover-bg: #8F2F73;
        --close-button-bg: #303030;
        --close-button-hover-bg: #8F2F73;
        --delete-button-bg: #ba2121;
        --delete-button-hover-bg: #a41515;

        --object-tools-fg: var(--button-fg);
        --object-tools-bg: var(--close-button-bg);
        --object-tools-hover-bg: var(--close-button-hover-bg);

        --font-family-primary: system-ui;
        --font-family-monospace: system-ui;
        color-scheme: light;
    }

    .login #container {
        border-radius: 5px!important;
        margin: 200px auto!important;
    }

    .nowrap {
        white-space: wrap;
    }

    table {
        border: 1px solid #ddd;
        font-size: 14px;
    }
    table th, table td {
        padding: 10px 15px;
        border: 1px solid #ddd;
        vertical-align: middle;
    }
    table thead th .text a {
        padding: 10px;
        text-wrap: wrap;
        text-align: center;
    }

    a:link, a:visited {
        text-decoration: none;
    }

    table thead th .text a:focus, table thead th .text a:hover {
        background: inherit;
    }

    .button, input[type=submit], input[type=button], .submit-row input, a.button,
    .button.default, input[type=submit].default, .submit-row input.default {
        padding: 7px 15px;
        border-radius: 5px;
    }

    .object-tools a:link, .object-tools a:visited {
        height: 30px;
        border-radius: 5px;
        border: none;
        align-content: center;
    }

    a.section:focus, a.section:hover {
        text-decoration: none;
    }

    .dashboard #content {
        width: auto;
    }

    .toggle-nav-sidebar {
        border-right: 1px solid #ddd;
        width: 25px;
    }

    #nav-sidebar {
        border-right: 1px solid #ddd;
        overflow: auto;
        padding: 0 15px;
    }

    #nav-filter {
        padding: 10px 15px;
        margin: 15px 0;
        border: 1px solid #aaa;
    }

    .module h2, .inline-group h2, .module caption, #header
    {   
        padding: 10px 30px;
        font-size: 11px;
        text-align: left;
        font-weight: 500;
        text-transform: none;
    }

    .module caption {
        font-size: 14px;
        font-weight: bold;
        background-color: #555;
        border-radius: 5px 5px 0 0;
    }

    #content-related .module {
        padding: 5px;
        background: #fafafa;
        border: solid 1px #ddd;
        border-radius: 5px;
    }

    .theme-toggle {
        display: none;
    }

    .app-auth {
        display: none;
    }

    #changelist-filter {
        background: #fafafa!important;
        border: solid 1px #ddd;
        border-left: solid 1px #ddd!important;
        border-radius: 5px;
    }

    #changelist .actions select {
        height: 3rem;
        border: 1px solid #aaa;
        border-radius: 5px;
        font-size: 16px;
        padding: 10px 15px;
        margin-left: 15px;
        width: auto;
    }

    #changelist-filter h2 {
        padding: 10px 15px!important;
        border: none;
        border-radius: 5px 5px 0 0;
    }

    #toolbar {
        padding: 10px 15px!important;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #fafafa;
    }

    #toolbar #searchbar {
        border: 1px solid var(--border-color);
        padding: 5px 10px!important;
        margin-right: 5px!important;
    }

    #changelist-search img {
        vertical-align: middle;
        margin-right: 5px!important;
    }

    #toolbar form input[type="submit"], #changelist .actions .button {
        background: #303030!important;
        padding: 7px 15px!important;
        border: none!important;
        border-radius: 5px!important;
        color: #fefefe!important;
        height: auto!important;
        line-height: 1.3!important;
    }

    #toolbar form input[type="submit"]:hover, #changelist .actions .button:hover {
        background: #8F2F73!important;
        color: #fefefe!important;
    }

    #changelist .actions select {
        height: auto!important;
        color: #303030!important;
        border: 1px solid #ddd!important;
        border-radius: 5px!important;
        padding: 5px 10px!important;
        margin-right: 5px!important;
    }

    .viewlink, .inlineviewlink {
        padding-left: 0;
        background: none;
    }

    .hidelink {
        padding-left: 0;
        background: none;
    }

    input[type="checkbox"] {
        height: 16px;
        width: 16px;
        margin-right: 15px;
        accent-color: #8F2F73; 
    }

</style>

{% endblock %}



{% block nav-global %}{% endblock %}
