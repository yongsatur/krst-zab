{% extends "index.html" %}
{% load static %}

{% block content %}

<section class="login">
    <div class="container">
        <div class="col-6 offset-3 tab_content_item active">
            <h1>Вход в систему</h1>
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <p  {% if message.tags %} class=" {{ message.tags }} " {% endif %}> {{ message }} </p>
                {% endfor %}
            </div>
            {% endif %}
            <form method="post" action="{% url 'authorization' %}">
                {% csrf_token %}
                <label for="username">Введите логин:</label>
                <input name="username" id="username" type="text" autocomplete="on" placeholder="Логин" required>
                <label for="password">Введите пароль:</label>
                <input name="password" id="password" type="password" autocomplete="off" placeholder="Пароль" required>
                <button>Войти</button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
